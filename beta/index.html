<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b45"><link rel="manifest" href="manifest.json"><title>Diario Macro Beta</title><style>:root{--g:#176b45;--bg:#f3f6f3;--card:#fff;--t:#172019;--m:#657068;--l:#d9e3da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 13px 92px}.card{background:var(--card);border:1px solid var(--l);border-radius:17px;padding:15px;margin:11px 0}.grid,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:#eaf2ec;border-radius:12px;padding:11px}.kpi b{display:block;font-size:19px}h1{margin:0}h2{font-size:19px}label{display:block;font-weight:650;font-size:13px;margin:9px 0 4px}input,select,textarea,button{width:100%;min-height:44px;border:1px solid #bdc8bf;border-radius:10px;padding:9px;background:#fff;color:var(--t);font:inherit}textarea{min-height:120px}button{border:0;background:var(--g);color:#fff;font-weight:700;margin-top:8px}.alt,.edit{background:#e7f2eb;color:#155938}.danger{background:#f7e7e4;color:#96382d}.row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px 0;border-bottom:1px solid var(--l)}.actions{display:flex;gap:5px;align-items:center}.actions button{width:auto;margin:0;padding:7px}.note,.status{font-size:12px;color:var(--m)}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;overflow:auto;padding:6px}.tabs button{background:transparent;color:var(--m);margin:0;min-width:66px;font-size:11px}.tabs button.on{background:#e8f3ec;color:var(--g)}.page{display:none}.page.on{display:block}.result{background:#edf5ef;border-radius:11px;padding:11px;margin-top:9px}.summary{border-left:4px solid var(--g);padding-left:10px}.catalog-list{max-height:420px;overflow:auto}.catalog-item{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:10px 0;border-bottom:1px solid var(--l)}.catalog-item input{width:24px;min-height:24px;margin:2px 0}.warn{background:#fff3d8;border-radius:10px;padding:9px;color:#75510a}.ok{color:#155938;font-weight:700}@media(prefers-color-scheme:dark){:root{--bg:#101612;--card:#18201a;--t:#eef5ef;--m:#adb8b0;--l:#354139}.kpi{background:#202a23}input,select,textarea{background:#151c17}.tabs{background:#18201a}}</style></head><body><main class=app><h1>Diario Macro</h1><p class=note>Versione 2.4.0-beta.5</p><div id=today class="page on"></div><div id=add class=page></div><div id=foods class=page></div><div id=types class=page></div><div id=webimport class=page></div><div id=backup class=page></div></main><nav class=tabs><button data-p=today class=on>Oggi</button><button data-p=add>Aggiungi</button><button data-p=foods>Alimenti</button><button data-p=types>Giornate</button><button data-p=webimport>Importa web</button><button data-p=backup>Backup</button></nav><script>
const KEY='diarioMacroPWA_beta';const defaults=[['Pasta cotta',158,30.9,5.8,.9,80],['Riso cotto',130,28.2,2.7,.3,80],['Petto di pollo',165,0,31,3.6,150],['Yogurt greco 0%',59,3.6,10.3,.4,170],['Banana',89,22.8,1.1,.3,120]].map((x,i)=>({id:'d'+i,n:x[0],k:x[1],c:x[2],p:x[3],f:x[4],portion:x[5],custom:false}));let S=JSON.parse(localStorage.getItem(KEY)||'null')||{foods:defaults,types:[{id:'t1',n:'Riposo',k:2000,c:220,p:140}],days:{},entries:[]},filter='';S.foods.forEach(x=>x.portion=x.portion||100);const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),num=v=>Math.max(0,Number(String(v).replace(',','.'))||0),fmt=v=>num(v).toLocaleString('it-IT',{maximumFractionDigits:1}),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),todayKey=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),norm=s=>String(s||'').trim().toLocaleLowerCase('it-IT').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
function totals(){let d=todayKey();return S.entries.filter(x=>x.d===d).reduce((a,x)=>(a.k+=x.k,a.c+=x.c,a.p+=x.p,a.f+=x.f,a),{k:0,c:0,p:0,f:0})}function renderToday(){let a=totals(),rows=S.entries.filter(x=>x.d===todayKey()).map(x=>`<div class=row><div><b>${esc(x.n)} · ${fmt(x.portions)} porz.</b><div class=status>${esc(x.m)} · ${fmt(x.k)} kcal · C ${fmt(x.c)} · P ${fmt(x.p)} · G ${fmt(x.f)}</div></div><button class=danger onclick="delEntry('${x.id}')">×</button></div>`).join('')||'<p>Nessuna registrazione.</p>';today.innerHTML=`<div class=kpis>${[['Calorie',a.k,'kcal'],['Carboidrati',a.c,'g'],['Proteine',a.p,'g'],['Grassi',a.f,'g']].map(x=>`<div class=kpi><small>${x[0]}</small><b>${fmt(x[1])} ${x[2]}</b></div>`).join('')}</div><div class=card>${rows}</div>`}
function options(){let q=norm(filter);return S.foods.filter(x=>!q||norm(x.n).includes(q)).map(x=>`<option value="${x.id}">${esc(x.n)} · ${fmt(x.portion)} g</option>`).join('')}function renderAdd(){add.innerHTML=`<div class=card><h2>Aggiungi</h2><label>Cerca alimento</label><input id=qf value="${esc(filter)}"><label>Risultati</label><select id=af>${options()}</select><label>Porzioni</label><input id=ap type=number step=.1 value=1><label>Pasto</label><select id=am>${['Colazione','Spuntino','Pranzo','Merenda','Cena'].map(x=>`<option>${x}</option>`)}</select><button onclick=addEntry()>Aggiungi</button></div>`;qf.oninput=e=>{filter=e.target.value;af.innerHTML=options()}}
function renderFoods(){foods.innerHTML=`<div class=card><h2>Nuovo alimento</h2>${foodFields()}<button onclick=addFood()>Salva</button></div><div class=card>${S.foods.filter(x=>x.custom).map(x=>`<div class=row><div><b>${esc(x.n)}</b><div class=status>${x.portion} g · ${x.k} kcal · C ${x.c} · P ${x.p} · G ${x.f}</div></div><button class=danger onclick="delFood('${x.id}')">×</button></div>`).join('')||'<p>Nessun personalizzato.</p>'}</div>`}function foodFields(){return `<label>Nome</label><input id=fn><label>Porzione standard g</label><input id=fportion type=number><div class=grid><input id=fk type=number placeholder="kcal/100g"><input id=fc type=number placeholder="carbo/100g"><input id=fp type=number placeholder="proteine/100g"><input id=ff type=number placeholder="grassi/100g"></div>`}
function renderTypes(){types.innerHTML=`<div class=card><h2>Tipi giornata</h2>${S.types.map(x=>`<div class=row><div><b>${esc(x.n)}</b><div class=status>${x.k} kcal · C ${x.c} · P ${x.p}</div></div></div>`).join('')}</div>`}function renderWebImport(){webimport.innerHTML=`<div class=card><h2>Importa singolo prodotto</h2><label>URL prodotto specifico</label><input id=weburl placeholder="https://..."><button onclick=analyzeUrl()>Analizza URL</button><label>Oppure incolla la tabella nutrizionale</label><textarea id=webtext></textarea><button class=alt onclick="parseProduct(webtext.value,weburl.value)">Analizza testo</button><div id=preview></div></div><div class=card><h2>Analizza catalogo generale</h2><label>URL homepage o catalogo</label><input id=catalogUrl placeholder="https://umnin.it/"><label>Numero massimo di prodotti</label><input id=catalogLimit type=number min=1 max=100 value=50><button onclick=analyzeCatalog()>Cerca e analizza prodotti</button><p class=note>Il processo apre in sequenza le pagine prodotto trovate. Può richiedere alcuni minuti. Non chiudere l'app durante l'analisi.</p><div id=catalogStatus aria-live=polite></div><div id=catalogResults></div></div><div class=card><h2>Alternativa pratica: incolla link o HTML</h2><p class=note>Incolla uno o piu link prodotto, uno per riga. Puoi anche incollare il codice HTML della pagina catalogo: l app estrarra automaticamente tutti i link /products/, /product/ e /prodotto/.</p><label>Link prodotto o HTML catalogo</label><textarea id=pastedCatalog placeholder="https://umnin.it/products/prodotto-1&#10;https://umnin.it/products/prodotto-2&#10;&#10;oppure incolla qui il codice HTML della pagina"></textarea><label>URL base, necessario solo se nell HTML ci sono link relativi</label><input id=pastedBase value="https://umnin.it/" placeholder="https://umnin.it/"><button onclick=analyzePastedCatalog()>Estrai e analizza prodotti</button><div id=pastedStatus aria-live=polite></div><div id=pastedResults></div></div>`}
function renderBackup(){backup.innerHTML=`<div class=card><h2>Backup</h2><button onclick=exportData()>Esporta backup beta</button><label>File JSON</label><input id=imp type=file accept=.json><label>Modalità di importazione</label><select id=importMode><option value=merge>Unisci con i dati esistenti</option><option value=replace>Sostituisci completamente</option></select><button class=alt onclick=previewImport()>Analizza backup</button><div id=importPreview></div></div>`}
function addEntry(){let f=S.foods.find(x=>x.id===af.value),q=num(ap.value);if(!f||!q)return;let g=q*f.portion,r=g/100;S.entries.push({id:crypto.randomUUID(),d:todayKey(),m:am.value,n:f.n,portions:q,portion:f.portion,g,k:f.k*r,c:f.c*r,p:f.p*r,f:f.f*r});save();all();show('today')}function delEntry(id){S.entries=S.entries.filter(x=>x.id!==id);save();all()}function addFood(){let n=fn.value.trim(),portion=num(fportion.value);if(!n||!portion)return alert('Nome e porzione obbligatori');S.foods.push({id:crypto.randomUUID(),n,portion,k:num(fk.value),c:num(fc.value),p:num(fp.value),f:num(ff.value),custom:true});save();all()}function delFood(id){if(confirm('Eliminare?')){S.foods=S.foods.filter(x=>x.id!==id);save();all()}}
async function analyzeUrl(){let u=weburl.value.trim();if(!u)return;preview.innerHTML='<p>Analisi...</p>';try{let r=await fetch(u);if(!r.ok)throw 0;parseProduct(await r.text(),u)}catch{preview.innerHTML='<div class=result>Accesso bloccato. Incolla il testo della tabella nutrizionale.</div>'}}function grab(t,ps){for(let p of ps){let m=t.match(p);if(m)return num(m[1])}return 0}function parseProduct(raw,url=''){let t=raw.replace(/<[^>]+>/g,' '),slug=(url.split('/').filter(Boolean).pop()||'').replace(/[-_]/g,' '),portion=grab(t,[/(?:confezione|peso netto|formato|porzione)[^\d]{0,20}(\d+(?:[.,]\d+)?)\s*g/i,/\((\d+(?:[.,]\d+)?)\s*g\)/i]),k=grab(t,[/(\d+(?:[.,]\d+)?)\s*kcal/i]),c=grab(t,[/carboidrati[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]),pr=grab(t,[/proteine[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]),fat=grab(t,[/grassi[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]);preview.innerHTML=`<div class=result><b>Verifica i dati</b><input id=pn value="${esc(slug)}"><input id=pp value="${portion}" placeholder="porzione g"><div class=grid><input id=pk value="${k}" placeholder=kcal><input id=pc value="${c}" placeholder=carbo><input id=ppr value="${pr}" placeholder=proteine><input id=pf value="${fat}" placeholder=grassi></div><button onclick=saveCandidate()>Salva alimento</button></div>`}function saveCandidate(){let n=pn.value.trim(),portion=num(pp.value);if(!n||!portion)return alert('Completa nome e porzione');S.foods.push({id:crypto.randomUUID(),n,portion,k:num(pk.value),c:num(pc.value),p:num(ppr.value),f:num(pf.value),custom:true,source:weburl.value.trim()});save();all();alert('Salvato')}
let catalogCandidates=[];
function absoluteUrl(href,base){try{return new URL(href,base).href.split('#')[0]}catch{return ''}}
function productLinks(html,base){let doc=new DOMParser().parseFromString(html,'text/html'),host=new URL(base).host,links=[];doc.querySelectorAll('a[href]').forEach(a=>{let u=absoluteUrl(a.getAttribute('href'),base);if(!u)return;try{let x=new URL(u),path=x.pathname.toLowerCase();if(x.host===host&&(path.includes('/products/')||path.includes('/product/')||path.includes('/prodotto/'))&&!links.includes(u))links.push(u)}catch{}});return links}
function productFromHtml(raw,url){let doc=new DOMParser().parseFromString(raw,'text/html'),text=(doc.body?.innerText||raw).replace(/\s+/g,' '),json=[];doc.querySelectorAll('script[type="application/ld+json"]').forEach(x=>{try{let j=JSON.parse(x.textContent);json.push(...(Array.isArray(j)?j:[j]))}catch{}});let prod=json.flatMap(x=>x['@graph']||[x]).find(x=>x&&String(x['@type']).toLowerCase().includes('product')),name=(prod&&prod.name)||doc.querySelector('h1')?.textContent?.trim()||(url.split('/').filter(Boolean).pop()||'').replace(/[-_]/g,' '),portion=grab(text,[/(?:confezione|peso netto|formato|porzione)[^\d]{0,30}(\d+(?:[.,]\d+)?)\s*g/i,/\((\d+(?:[.,]\d+)?)\s*g\)/i]),k=grab(text,[/(\d+(?:[.,]\d+)?)\s*kcal/i]),c=grab(text,[/carboidrati[^\d]{0,25}(\d+(?:[.,]\d+)?)/i]),pr=grab(text,[/proteine[^\d]{0,25}(\d+(?:[.,]\d+)?)/i]),fat=grab(text,[/(?:grassi|lipidi)[^\d]{0,25}(\d+(?:[.,]\d+)?)/i]);return {id:crypto.randomUUID(),n:name.trim(),portion,k,c,p:pr,f:fat,custom:true,source:url,complete:Boolean(name&&portion&&k&&(c||pr||fat)),selected:Boolean(name&&portion&&k)}}
async function analyzeCatalog(){let base=catalogUrl.value.trim(),limit=Math.min(100,Math.max(1,num(catalogLimit.value)||50));if(!base)return alert('Inserisci URL catalogo');catalogCandidates=[];catalogResults.innerHTML='';catalogStatus.innerHTML='<div class=result>Caricamento catalogo...</div>';try{let r=await fetch(base);if(!r.ok)throw Error('HTTP '+r.status);let links=productLinks(await r.text(),base).slice(0,limit);if(!links.length)throw Error('Nessun link prodotto trovato');for(let i=0;i<links.length;i++){catalogStatus.innerHTML=`<div class=result>Analisi ${i+1} di ${links.length}<br><small>${esc(links[i])}</small></div>`;try{let pr=await fetch(links[i]);if(pr.ok){let item=productFromHtml(await pr.text(),links[i]);catalogCandidates.push(item)}}catch{}await new Promise(ok=>setTimeout(ok,180))}renderCatalogResults()}catch(e){catalogStatus.innerHTML=`<div class=warn><b>Catalogo non analizzabile automaticamente.</b><br>${esc(e.message||'Richiesta bloccata')}. Prova una pagina collezione specifica o importa i prodotti singolarmente.</div>`}}
function linksFromPasted(value,base){let links=[];const add=u=>{u=absoluteUrl(String(u||'').trim(),base);if(!u)return;try{let x=new URL(u),path=x.pathname.toLowerCase();if((path.includes('/products/')||path.includes('/product/')||path.includes('/prodotto/'))&&!links.includes(u))links.push(u)}catch{}};let text=String(value||'');if(/<a\s|href\s*=|<html|<body/i.test(text)){let doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('a[href]').forEach(a=>add(a.getAttribute('href')))}text.match(/https?:\/\/[^\s"'<>]+/gi)?.forEach(add);text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(add);return links}
async function analyzePastedCatalog(){let raw=pastedCatalog.value.trim(),base=pastedBase.value.trim()||location.origin+'/',links=linksFromPasted(raw,base);if(!raw)return alert('Incolla almeno un link o il codice HTML');if(!links.length){pastedStatus.innerHTML='<div class=warn><b>Nessun link prodotto trovato.</b><br>Usa URL che contengano /products/, /product/ o /prodotto/. Se hai copiato solo il testo visibile della pagina, copia invece gli indirizzi dei prodotti oppure il codice sorgente HTML.</div>';pastedResults.innerHTML='';return}catalogCandidates=[];pastedResults.innerHTML='';for(let i=0;i<links.length;i++){pastedStatus.innerHTML=`<div class=result>Analisi ${i+1} di ${links.length}<br><small>${esc(links[i])}</small></div>`;try{let r=await fetch(links[i]);if(r.ok)catalogCandidates.push(productFromHtml(await r.text(),links[i]));else catalogCandidates.push({id:crypto.randomUUID(),n:links[i].split('/').filter(Boolean).pop().replace(/[-_]/g,' '),portion:0,k:0,c:0,p:0,f:0,custom:true,source:links[i],complete:false,selected:false})}catch{catalogCandidates.push({id:crypto.randomUUID(),n:links[i].split('/').filter(Boolean).pop().replace(/[-_]/g,' '),portion:0,k:0,c:0,p:0,f:0,custom:true,source:links[i],complete:false,selected:false})}await new Promise(ok=>setTimeout(ok,180))}renderPastedResults()}
function renderPastedResults(){let complete=catalogCandidates.filter(x=>x.complete).length,partial=catalogCandidates.length-complete;pastedStatus.innerHTML=`<div class=result><b>Analisi completata</b><br>Trovati: ${catalogCandidates.length} · completi: ${complete} · da verificare: ${partial}</div>`;pastedResults.innerHTML=`<div class="catalog-list">${catalogCandidates.map((x,i)=>`<label class=catalog-item><input type=checkbox ${x.selected?'checked':''} onchange="catalogCandidates[${i}].selected=this.checked"><span><b>${esc(x.n||'Prodotto senza nome')}</b><br><small>${fmt(x.portion)} g · ${fmt(x.k)} kcal · C ${fmt(x.c)} · P ${fmt(x.p)} · G ${fmt(x.f)}</small>${x.complete?'':'<br><span class=warn>Dati incompleti o pagina non leggibile</span>'}</span></label>`).join('')}</div><button onclick=importCatalogSelected()>Importa prodotti selezionati</button>`}
function renderCatalogResults(){let complete=catalogCandidates.filter(x=>x.complete).length,partial=catalogCandidates.length-complete;catalogStatus.innerHTML=`<div class=result><b>Analisi completata</b><br>Trovati: ${catalogCandidates.length} · completi: ${complete} · da verificare: ${partial}</div>`;catalogResults.innerHTML=`<div class="catalog-list">${catalogCandidates.map((x,i)=>`<label class=catalog-item><input type=checkbox ${x.selected?'checked':''} onchange="catalogCandidates[${i}].selected=this.checked"><span><b>${esc(x.n||'Prodotto senza nome')}</b><br><small>${fmt(x.portion)} g · ${fmt(x.k)} kcal · C ${fmt(x.c)} · P ${fmt(x.p)} · G ${fmt(x.f)}</small>${x.complete?'':'<br><span class=warn>Dati incompleti: correggere dopo l’importazione</span>'}</span></label>`).join('')}</div><button onclick=importCatalogSelected()>Importa prodotti selezionati</button>`}
function importCatalogSelected(){let chosen=catalogCandidates.filter(x=>x.selected),existing=new Set(S.foods.map(x=>norm(x.n))),added=0,skipped=0;chosen.forEach(x=>{if(!x.n||existing.has(norm(x.n))){skipped++;return}S.foods.push(x);existing.add(norm(x.n));added++});save();all();alert(`Importati ${added} prodotti. Duplicati o non validi ignorati: ${skipped}.`)}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='diario-macro-beta-backup.json';a.click()}let pendingImport=null;function previewImport(){let f=imp.files[0];if(!f)return alert('Seleziona un file');let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.foods||!x.entries||!x.types)throw 0;pendingImport=x;let names=new Set(S.foods.map(a=>norm(a.n))),ids=new Set(S.entries.map(a=>a.id)),typeNames=new Set(S.types.map(a=>norm(a.n))),nf=x.foods.filter(a=>!names.has(norm(a.n))).length,df=x.foods.length-nf,ne=x.entries.filter(a=>!ids.has(a.id)).length,nt=x.types.filter(a=>!typeNames.has(norm(a.n))).length;importPreview.innerHTML=`<div class="result summary"><b>Anteprima importazione</b><p>Alimenti nuovi: ${nf}<br>Alimenti duplicati mantenuti dalla beta: ${df}<br>Entry nuove: ${ne}<br>Tipi giornata nuovi: ${nt}</p><button onclick=confirmImport()>Conferma ${importMode.value==='merge'?'unione':'sostituzione'}</button></div>`}catch{alert('Backup non valido')}};r.readAsText(f)}function mergeData(x){let foodNames=new Set(S.foods.map(a=>norm(a.n)));x.foods.forEach(a=>{if(!foodNames.has(norm(a.n))){S.foods.push(a);foodNames.add(norm(a.n))}});let entryIds=new Set(S.entries.map(a=>a.id));x.entries.forEach(a=>{if(!entryIds.has(a.id)){S.entries.push(a);entryIds.add(a.id)}});let typeNames=new Set(S.types.map(a=>norm(a.n)));x.types.forEach(a=>{if(!typeNames.has(norm(a.n))){S.types.push(a);typeNames.add(norm(a.n))}});Object.entries(x.days||{}).forEach(([d,id])=>{if(!S.days[d])S.days[d]=id})}function confirmImport(){if(!pendingImport)return;if(importMode.value==='replace'){if(!confirm('Sostituire tutto l archivio beta?'))return;S=pendingImport}else mergeData(pendingImport);save();pendingImport=null;all();alert('Importazione completata')}
function show(id){document.querySelectorAll('.page,.tabs button').forEach(x=>x.classList.remove('on'));document.querySelector('#'+id).classList.add('on');document.querySelector(`[data-p=${id}]`).classList.add('on')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));function all(){renderToday();renderAdd();renderFoods();renderTypes();renderWebImport();renderBackup()}all();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
