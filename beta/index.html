<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b45"><link rel="manifest" href="manifest.json"><title>Diario Macro</title><style>
:root{--g:#176b45;--bg:#f3f6f3;--card:#fff;--txt:#172019;--mut:#68736b;--line:#dce5dd;--red:#9c3428}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 13px calc(90px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0}.grid,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:#eaf2ec;border-radius:13px;padding:12px}.kpi b{display:block;font-size:19px}.kpi small,.status,.note{color:var(--mut);font-size:12px}h1{margin:3px 0;font-size:27px}h2{font-size:19px;margin:0 0 8px}label{display:block;font-weight:650;font-size:13px;margin:9px 0 4px}input,select,textarea,button{width:100%;min-height:44px;border:1px solid #bdc8bf;border-radius:10px;padding:9px;background:#fff;color:var(--txt);font:inherit}textarea{min-height:130px}button{border:0;background:var(--g);color:#fff;font-weight:700;margin-top:9px}.alt,.edit{background:#e7f2eb;color:#155938}.danger{background:#f8e8e5;color:var(--red)}.row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}.actions{display:flex;gap:5px;align-items:center}.actions button{width:auto;margin:0;padding:7px;min-height:36px}.chips{display:flex;gap:5px;overflow:auto}.chips button{min-width:72px;background:#e7f2eb;color:#155938}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px max(6px,calc((100% - 760px)/2));padding-bottom:calc(6px + env(safe-area-inset-bottom))}.tabs button{background:transparent;color:var(--mut);margin:0;min-width:62px;padding:7px 2px;font-size:11px}.tabs button.on{color:var(--g);background:#e8f3ec}.page{display:none}.page.on{display:block}.progress{height:7px;background:#e4e9e5;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--g)}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead button{width:auto;margin:0}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:var(--mut)}.day{aspect-ratio:1;margin:0;padding:2px;background:#fff;color:var(--txt);border:1px solid var(--line);position:relative}.day.has:after{content:"";position:absolute;width:5px;height:5px;background:var(--g);border-radius:50%;bottom:3px;left:calc(50% - 2px)}.day.sel{outline:3px solid #55a677}.result{padding:10px;border-radius:10px;background:#edf5ef;margin-top:9px}@media(prefers-color-scheme:dark){:root{--bg:#101612;--card:#18201a;--txt:#eef5ef;--mut:#adb8b0;--line:#354139}.kpi{background:#202a23}input,select,textarea,.day{background:#151c17}.tabs{background:#18201a}}</style></head><body><main class=app><h1>Diario Macro</h1><p class=note id=ver></p><div id=today class="page on"></div><div id=add class=page></div><div id=history class=page></div><div id=foods class=page></div><div id=types class=page></div><div id=webimport class=page></div><div id=backup class=page></div></main><nav class=tabs><button data-p=today class=on>Oggi</button><button data-p=add>Aggiungi</button><button data-p=history>Storico</button><button data-p=foods>Alimenti</button><button data-p=types>Giornate</button><button data-p=webimport>Importa web</button><button data-p=backup>Backup</button></nav><script>
const VERSION='2.4.0-beta.1',KEY='diarioMacroPWA_beta';ver.textContent='Versione '+VERSION;
const defaults=[['Pasta cotta',158,30.9,5.8,.9,80],['Riso cotto',130,28.2,2.7,.3,80],['Pane comune',265,49,9,3.2,50],['Petto di pollo cotto',165,0,31,3.6,150],['Salmone cotto',206,0,22,12,150],['Uovo intero',143,.7,12.6,9.5,60],['Yogurt greco 0%',59,3.6,10.3,.4,170],['Banana',89,22.8,1.1,.3,120],['Olio EVO',884,0,0,100,10]].map((x,i)=>({id:'d'+i,n:x[0],k:x[1],c:x[2],p:x[3],f:x[4],portion:x[5],custom:false}));
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{foods:defaults,types:[{id:'t1',n:'Riposo',k:2000,c:220,p:140},{id:'t2',n:'Allenamento',k:2400,c:300,p:150}],days:{},entries:[]};S.foods.forEach(x=>x.portion=x.portion||100);let selected=ld(),cursor=new Date(),filter='';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),num=v=>Math.max(0,Number(String(v).replace(',','.'))||0),fmt=v=>num(v).toLocaleString('it-IT',{maximumFractionDigits:1}),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ld(d=new Date()){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function totals(d){return S.entries.filter(x=>x.d===d).reduce((a,x)=>(a.k+=x.k,a.c+=x.c,a.p+=x.p,a.f+=x.f,a),{k:0,c:0,p:0,f:0})}function typ(d){return S.types.find(x=>x.id===S.days[d])}function kpi(n,v,u){return `<div class=kpi><small>${n}</small><b>${fmt(v)} ${u}</b></div>`}function prog(n,v,t,u){let q=t?Math.min(100,v/t*100):0;return `<div class=status>${n}: ${fmt(v)} / ${fmt(t)} ${u}</div><div class=progress><div class=fill style="width:${q}%"></div></div>`}
function dayView(d){let a=totals(d),t=typ(d),rows=S.entries.filter(x=>x.d===d).map(x=>`<div class=row><div><b>${esc(x.n)} · ${fmt(x.portions)} porz.</b><div class=status>${esc(x.m)} · ${fmt(x.g)} g · ${fmt(x.k)} kcal · C ${fmt(x.c)} · P ${fmt(x.p)} · G ${fmt(x.f)}</div></div><div class=actions><button class=edit onclick="editEntry('${x.id}')">Modifica</button><button class=danger onclick="delEntry('${x.id}')">×</button></div></div>`).join('')||'<p>Nessun alimento registrato.</p>';return `<div class=kpis>${kpi('Calorie',a.k,'kcal')}${kpi('Carboidrati',a.c,'g')}${kpi('Proteine',a.p,'g')}${kpi('Grassi',a.f,'g')}</div>${t?`<div class=card><b>Target: ${esc(t.n)}</b>${prog('Calorie',a.k,t.k,'kcal')}${prog('Carboidrati',a.c,t.c,'g')}${prog('Proteine',a.p,t.p,'g')}</div>`:''}<div class=card><b>Alimenti</b>${rows}</div>`}
function typeSelect(d){return `<select onchange="setType('${d}',this.value)"><option value="">Nessuno</option>${S.types.map(x=>`<option value="${x.id}" ${S.days[d]===x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`}function renderToday(){let d=ld();today.innerHTML=`<div class=card><label>Tipo di oggi</label>${typeSelect(d)}</div>${dayView(d)}`}
function foodOptions(){let q=filter.trim().toLowerCase();return S.foods.filter(x=>!q||x.n.toLowerCase().includes(q)).map(x=>`<option value="${x.id}">${esc(x.n)} · ${fmt(x.portion)} g</option>`).join('')}function renderAdd(){add.innerHTML=`<div class=card><h2>Aggiungi alimento</h2><label>Data</label><input id=ad type=date value="${selected}"><label>Cerca alimento</label><input id=searchFood value="${esc(filter)}" placeholder="Scrivi parte del nome"><div id=countFood class=status></div><label>Risultati</label><select id=af onchange=hint()>${foodOptions()}</select><label>Numero di porzioni</label><input id=ap type=number min=.1 max=50 step=.1 value=1 oninput=hint()><div class=chips>${[.5,1,1.5,2].map(x=>`<button onclick="ap.value=${x};hint()">${x}</button>`).join('')}</div><div id=portionHint class=status></div><label>Pasto</label><select id=am>${['Colazione','Spuntino','Pranzo','Merenda','Cena'].map(x=>`<option>${x}</option>`).join('')}</select><button onclick=addEntry()>Aggiungi</button></div>`;searchFood.addEventListener('input',e=>{filter=e.target.value;let current=af.value;af.innerHTML=foodOptions();if([...af.options].some(o=>o.value===current))af.value=current;countFood.textContent=af.options.length+' risultati';hint()});countFood.textContent=af.options.length+' risultati';hint()}function hint(){let f=S.foods.find(x=>x.id===document.querySelector('#af')?.value),q=num(document.querySelector('#ap')?.value);if(portionHint)portionHint.textContent=f?`${fmt(q)} porzioni = ${fmt(q*f.portion)} g`: 'Nessun alimento trovato'}
function renderFoods(){let rows=S.foods.filter(x=>x.custom).map(x=>`<div class=row><div><b>${esc(x.n)}</b><div class=status>${x.portion} g/porzione · ${x.k} kcal · C ${x.c} · P ${x.p} · G ${x.f} per 100 g</div></div><div class=actions><button class=edit onclick="editFood('${x.id}')">Modifica</button><button class=danger onclick="delFood('${x.id}')">×</button></div></div>`).join('')||'<p>Nessun alimento personalizzato.</p>';foods.innerHTML=`<div class=card><h2>Nuovo alimento</h2>${foodForm()}<button onclick=addFood()>Salva alimento</button></div><div class=card><h2>Personalizzati</h2>${rows}</div>`}function foodForm(){return `<label>Nome</label><input id=fn><label>Grammi porzione standard</label><input id=fportion type=number><div class=grid><div><label>kcal /100 g</label><input id=fk type=number></div><div><label>Carbo g /100 g</label><input id=fc type=number></div><div><label>Proteine g /100 g</label><input id=fp type=number></div><div><label>Grassi g /100 g</label><input id=ff type=number></div></div>`}
function renderTypes(){let rows=S.types.map(x=>`<div class=row><div><b>${esc(x.n)}</b><div class=status>${x.k} kcal · C ${x.c} g · P ${x.p} g</div></div><div class=actions><button class=edit onclick="editType('${x.id}')">Modifica</button><button class=danger onclick="delType('${x.id}')">×</button></div></div>`).join('');types.innerHTML=`<div class=card><h2>Nuovo tipo giornata</h2><label>Nome</label><input id=tn><div class=grid><div><label>kcal</label><input id=tk type=number></div><div><label>Carbo g</label><input id=tc type=number></div><div><label>Proteine g</label><input id=tp type=number></div></div><button onclick=addType()>Salva tipo</button></div><div class=card>${rows}</div>`}
function renderHistory(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<42;i++){let n=i-start+1,d=ld(new Date(y,m,n));cells+=`<button class="day ${S.entries.some(x=>x.d===d)?'has ':''}${d===selected?'sel':''}" onclick="selDay('${d}')">${new Date(d+'T12:00').getDate()}</button>`}history.innerHTML=`<div class=card><div class=calhead><button class=alt onclick=move(-1)>‹</button><b>${new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(first)}</b><button class=alt onclick=move(1)>›</button></div><div class=calgrid>${['L','M','M','G','V','S','D'].map(x=>`<div class=dow>${x}</div>`).join('')}${cells}</div></div><div class=card><h2>${new Intl.DateTimeFormat('it-IT',{dateStyle:'long'}).format(new Date(selected+'T12:00'))}</h2><label>Tipo giornata</label>${typeSelect(selected)}<button class=alt onclick="showAddDay()">Aggiungi alimento</button></div>${dayView(selected)}`}
function renderBackup(){backup.innerHTML=`<div class=card><h2>Backup</h2><button onclick=exportData()>Esporta backup</button><label>Importa JSON</label><input id=imp type=file accept=.json><button class=alt onclick=importData()>Importa</button></div>`}
function addEntry(){let f=S.foods.find(x=>x.id===af.value),q=num(ap.value),d=ad.value;if(!f||!q||!d)return alert('Controlla i dati');let g=q*f.portion,r=g/100;S.entries.push({id:crypto.randomUUID(),d,m:am.value,n:f.n,portions:q,portion:f.portion,g,k:f.k*r,c:f.c*r,p:f.p*r,f:f.f*r});selected=d;save();all();show(d===ld()?'today':'history')}function editEntry(id){let x=S.entries.find(e=>e.id===id),q=prompt('Numero porzioni',x.portions),m=prompt('Pasto',x.m);if(q===null||m===null)return;q=num(q);if(!q)return;let food=S.foods.find(f=>f.n===x.n),portion=x.portion||100,g=q*portion,r=g/100;if(food)Object.assign(x,{portions:q,m,g,k:food.k*r,c:food.c*r,p:food.p*r,f:food.f*r});else{let z=g/x.g;Object.assign(x,{portions:q,m,g,k:x.k*z,c:x.c*z,p:x.p*z,f:x.f*z})}save();all()}function delEntry(id){S.entries=S.entries.filter(x=>x.id!==id);save();all()}
function addFood(){let n=fn.value.trim(),portion=num(fportion.value);if(!n||!portion)return alert('Nome e porzione obbligatori');S.foods.push({id:crypto.randomUUID(),n,portion,k:num(fk.value),c:num(fc.value),p:num(fp.value),f:num(ff.value),custom:true});save();all()}function editFood(id){let x=S.foods.find(e=>e.id===id);if(!x)return;let vals=[prompt('Nome',x.n),prompt('Grammi porzione',x.portion),prompt('kcal /100 g',x.k),prompt('Carbo /100 g',x.c),prompt('Proteine /100 g',x.p),prompt('Grassi /100 g',x.f)];if(vals.some(v=>v===null))return;if(!vals[0].trim()||!num(vals[1]))return alert('Valori non validi');Object.assign(x,{n:vals[0].trim(),portion:num(vals[1]),k:num(vals[2]),c:num(vals[3]),p:num(vals[4]),f:num(vals[5])});save();all()}function delFood(id){if(confirm('Eliminare?')){S.foods=S.foods.filter(x=>x.id!==id);save();all()}}
function addType(){let n=tn.value.trim();if(!n)return;S.types.push({id:crypto.randomUUID(),n,k:num(tk.value),c:num(tc.value),p:num(tp.value)});save();all()}function editType(id){let x=S.types.find(e=>e.id===id);if(!x)return;let n=prompt('Nome tipo',x.n),k=prompt('Target kcal',x.k),c=prompt('Target carbo g',x.c),pr=prompt('Target proteine g',x.p);if([n,k,c,pr].some(v=>v===null)||!n.trim())return;Object.assign(x,{n:n.trim(),k:num(k),c:num(c),p:num(pr)});save();all()}function delType(id){if(!confirm('Eliminare questo tipo?'))return;S.types=S.types.filter(x=>x.id!==id);Object.keys(S.days).forEach(d=>{if(S.days[d]===id)delete S.days[d]});save();all()}function setType(d,id){if(id)S.days[d]=id;else delete S.days[d];save();all()}
function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);renderHistory()}function selDay(d){selected=d;cursor=new Date(d+'T12:00');renderHistory()}function showAddDay(){renderAdd();ad.value=selected;show('add')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='diario-macro-backup.json';a.click()}function importData(){let f=imp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.foods||!x.entries||!x.types)throw 0;S=x;save();all();alert('Importato')}catch{alert('File non valido')}};r.readAsText(f)}
function renderWebImport(){webimport.innerHTML=`<div class=card><h2>Importa alimento da pagina web</h2><label>URL prodotto</label><input id=weburl placeholder="https://..."><button onclick=analyzeUrl()>Analizza URL</button><p class=note>Il tentativo diretto può essere bloccato dal sito per CORS. In quel caso incolla sotto il testo della pagina o della tabella nutrizionale.</p><label>Testo pagina o tabella nutrizionale</label><textarea id=webtext placeholder="Nome, confezione 250 g, 256 kcal, carboidrati 34,1 g, proteine 11,6 g, grassi 7,6 g"></textarea><button class=alt onclick="parseProduct(webtext.value,weburl.value)">Analizza testo</button><div id=preview></div></div>`}async function analyzeUrl(){let u=weburl.value.trim();if(!u)return alert('Inserisci URL');preview.innerHTML='<p>Analisi in corso...</p>';try{let r=await fetch(u);if(!r.ok)throw Error(r.status);let t=await r.text();parseProduct(t,u)}catch(e){preview.innerHTML='<div class=result><b>Accesso diretto bloccato o non disponibile.</b><p>Apri la pagina, copia la tabella nutrizionale e incollala nel riquadro. Questo è il fallback previsto per i siti con CORS.</p></div>'}}function grab(t,patterns){for(let p of patterns){let m=t.match(p);if(m)return num(m[1])}return 0}function parseProduct(raw,url=''){let t=raw.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' '),title=(t.match(/(?:^|\n)\s*([^\n]{3,80}?)(?:\s*\(|\s+-)/)||[])[1]||'';if(!title&&url){let q=url.split('/').filter(Boolean).pop()||'';title=q.replace(/[-_]/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}let portion=grab(t,[/(?:confezione|peso netto|formato|vaschetta|porzione)[^\d]{0,20}(\d+(?:[.,]\d+)?)\s*g/i,/\((\d+(?:[.,]\d+)?)\s*g\)/i]),k=grab(t,[/(\d+(?:[.,]\d+)?)\s*kcal/i]),c=grab(t,[/carboidrati[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]),pr=grab(t,[/proteine[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]),fat=grab(t,[/grassi[^\d]{0,20}(\d+(?:[.,]\d+)?)/i]);window.candidate={n:title.trim(),portion,k,c,p:pr,f:fat};preview.innerHTML=`<div class=result><b>Anteprima, verifica prima di salvare</b><label>Nome</label><input id=pn value="${esc(candidate.n)}"><label>Porzione g</label><input id=pp value="${candidate.portion}"><div class=grid><input id=pk value="${candidate.k}" placeholder=kcal><input id=pc value="${candidate.c}" placeholder=carbo><input id=ppr value="${candidate.p}" placeholder=proteine><input id=pf value="${candidate.f}" placeholder=grassi></div><button onclick=saveCandidate()>Salva come alimento</button></div>`}function saveCandidate(){let n=pn.value.trim(),portion=num(pp.value);if(!n||!portion)return alert('Completa nome e porzione');S.foods.push({id:crypto.randomUUID(),n,portion,k:num(pk.value),c:num(pc.value),p:num(ppr.value),f:num(pf.value),custom:true,source:weburl.value.trim()});save();all();alert('Alimento salvato')}
function show(id){document.querySelectorAll('.page,.tabs button').forEach(x=>x.classList.remove('on'));document.querySelector('#'+id).classList.add('on');document.querySelector(`[data-p=${id}]`).classList.add('on')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));function all(){renderToday();renderAdd();renderHistory();renderFoods();renderTypes();renderBackup();renderWebImport();}all();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
