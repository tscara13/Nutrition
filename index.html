<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b45"><link rel="manifest" href="manifest.json"><title>Diario Macro</title><style>
:root{--g:#176b45;--bg:#f3f6f3;--card:#fff;--txt:#172019;--mut:#68736b;--line:#dce5dd;--blue:#2365a8;--orange:#b95a18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom))}h1{font-size:27px;margin:4px 0}p{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #163b2010}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px;border-radius:14px;background:#eef4ef}.kpi b{display:block;font-size:20px}.kpi small{color:var(--mut)}label{display:block;font-weight:650;font-size:13px;margin:9px 0 5px}input,select,button{width:100%;min-height:44px;border-radius:11px;border:1px solid #becac0;background:#fff;padding:9px;font:inherit}button{border:0;background:var(--g);color:#fff;font-weight:700;margin-top:10px}button.alt{background:#e7f2eb;color:#155938}.danger{background:#f8e8e5;color:#9c3428}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.row button{width:auto;margin:0}.progress{height:8px;border-radius:99px;background:#e5e9e6;overflow:hidden}.fill{height:100%;background:var(--g)}.status{font-size:13px;color:var(--mut);margin:4px 0 9px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px max(8px,calc((100% - 760px)/2));padding-bottom:calc(7px + env(safe-area-inset-bottom))}.tabs button{background:transparent;color:var(--mut);margin:0;border-radius:8px;font-size:12px}.tabs button.on{color:var(--g);background:#e8f3ec}.page{display:none}.page.on{display:block}.chips{display:flex;gap:6px;overflow:auto}.chips button{min-width:70px;background:#e7f2eb;color:#155938}.note{font-size:12px}.hidden{display:none}@media(prefers-color-scheme:dark){:root{--bg:#101612;--card:#18201a;--txt:#eef5ef;--mut:#adb8b0;--line:#344038}.kpi{background:#202a23}input,select{background:#151c17;color:var(--txt);border-color:#506056}.tabs{background:#18201a}}
</style></head><body><main class="app"><h1>Diario Macro</h1><div id="today" class="page on"></div><div id="add" class="page"></div><div id="foods" class="page"></div><div id="types" class="page"></div><div id="backup" class="page"></div></main><nav class="tabs"><button data-p="today" class="on">Oggi</button><button data-p="add">Aggiungi</button><button data-p="foods">Alimenti</button><button data-p="types">Giornate</button><button data-p="backup">Backup</button></nav><script>
const defaults=[['Pasta cotta',158,30.9,5.8,0.9],['Riso cotto',130,28.2,2.7,.3],['Pane comune',265,49,9,3.2],['Petto di pollo cotto',165,0,31,3.6],['Salmone cotto',206,0,22,12],['Uovo intero',143,.7,12.6,9.5],['Yogurt greco 0%',59,3.6,10.3,.4],['Parmigiano Reggiano',402,0,32.4,30],['Banana',89,22.8,1.1,.3],['Olio EVO',884,0,0,100],['Mandorle',579,21.6,21.2,49.9]].map((x,i)=>({id:'d'+i,n:x[0],k:x[1],c:x[2],p:x[3],f:x[4],custom:false}));
let S=JSON.parse(localStorage.getItem('diarioMacroPWA')||'null')||{foods:defaults,types:[{id:'t1',n:'Riposo',k:2000,c:220,p:140},{id:'t2',n:'Allenamento',k:2400,c:300,p:150}],days:{},entries:[]};
const save=()=>localStorage.setItem('diarioMacroPWA',JSON.stringify(S)), day=()=>new Date().toISOString().slice(0,10), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), num=(v)=>Math.max(0,Number(String(v).replace(',','.'))||0), fmt=n=>n.toLocaleString('it-IT',{maximumFractionDigits:1});
function totals(d){return S.entries.filter(e=>e.d===d).reduce((a,e)=>(a.k+=e.k,a.c+=e.c,a.p+=e.p,a.f+=e.f,a),{k:0,c:0,p:0,f:0})}function typeFor(d){return S.types.find(t=>t.id===S.days[d])}
function renderToday(){let d=day(),a=totals(d),t=typeFor(d), rows=S.entries.filter(e=>e.d===d).map(e=>`<div class=row><div><b>${esc(e.n)} · ${fmt(e.g)} g</b><div class=status>${esc(e.m)} · ${fmt(e.k)} kcal · C ${fmt(e.c)} · P ${fmt(e.p)} · G ${fmt(e.f)}</div></div><button class=danger onclick="delEntry('${e.id}')">×</button></div>`).join('')||'<p>Nessun alimento registrato.</p>';let target=t?`<div class=card><b>Target: ${esc(t.n)}</b>${prog('Calorie',a.k,t.k,'kcal')}${prog('Carboidrati',a.c,t.c,'g')}${prog('Proteine',a.p,t.p,'g')}</div>`:'<div class=card><p>Assegna un tipo alla giornata per vedere i target.</p></div>';document.querySelector('#today').innerHTML=`<div class=card><label>Tipo di oggi</label><select onchange="setDayType(this.value)"><option value="">Nessuno</option>${S.types.map(x=>`<option value=${x.id} ${S.days[d]===x.id?'selected':''}>${esc(x.n)}</option>`)}</select></div><div class=kpis>${kpi('Calorie',a.k,'kcal')}${kpi('Carboidrati',a.c,'g')}${kpi('Proteine',a.p,'g')}${kpi('Grassi',a.f,'g')}</div>${target}<div class=card><b>Alimenti di oggi</b>${rows}</div>`}
function kpi(n,v,u){return `<div class=kpi><small>${n}</small><b>${fmt(v)} ${u}</b></div>`}function prog(n,v,t,u){let pc=t?Math.min(100,v/t*100):0;return `<div class=status>${n}: ${fmt(v)} / ${fmt(t)} ${u} (${fmt(pc)}%)</div><div class=progress><div class=fill style="width:${pc}%"></div></div>`}
function renderAdd(){document.querySelector('#add').innerHTML=`<div class=card><h2>Aggiungi alimento</h2><label>Alimento</label><select id=af>${S.foods.map(f=>`<option value=${f.id}>${esc(f.n)}</option>`)}</select><label>Quantità in grammi</label><input id=ag type=number min=1 max=3000 value=100><div class=chips>${[50,100,150,200].map(x=>`<button onclick="ag.value=${x}">${x} g</button>`).join('')}</div><label>Pasto</label><select id=am>${['Colazione','Spuntino','Pranzo','Merenda','Cena'].map(x=>`<option>${x}</option>`)}</select><button onclick=addEntry()>Aggiungi a oggi</button></div>`}
function renderFoods(){let rows=S.foods.filter(f=>f.custom).map(f=>`<div class=row><div><b>${esc(f.n)}</b><div class=status>100 g: ${f.k} kcal · C ${f.c} · P ${f.p} · G ${f.f}</div></div><button class=danger onclick="delFood('${f.id}')">×</button></div>`).join('')||'<p>Nessun alimento personalizzato.</p>';document.querySelector('#foods').innerHTML=`<div class=card><h2>Nuovo alimento</h2><label>Nome</label><input id=fn><div class=grid><div><label>kcal</label><input id=fk type=number></div><div><label>Carboidrati g</label><input id=fc type=number></div><div><label>Proteine g</label><input id=fp type=number></div><div><label>Grassi g</label><input id=ff type=number></div></div><p class=note>Inserisci tutti i valori per 100 g.</p><button onclick=addFood()>Salva alimento</button></div><div class=card><h2>Personalizzati</h2>${rows}</div>`}
function renderTypes(){let rows=S.types.map(t=>`<div class=row><div><b>${esc(t.n)}</b><div class=status>${t.k} kcal · C ${t.c} g · P ${t.p} g</div></div><button class=danger onclick="delType('${t.id}')">×</button></div>`).join('');document.querySelector('#types').innerHTML=`<div class=card><h2>Nuovo tipo di giornata</h2><label>Nome, per esempio Allenamento intenso</label><input id=tn><div class=grid><div><label>Target kcal</label><input id=tk type=number></div><div><label>Target carbo g</label><input id=tc type=number></div><div><label>Target proteine g</label><input id=tp type=number></div></div><button onclick=addType()>Salva tipo</button></div><div class=card><h2>Tipi disponibili</h2>${rows}</div>`}
function renderBackup(){document.querySelector('#backup').innerHTML=`<div class=card><h2>Backup</h2><p>Esporta periodicamente i dati, soprattutto prima di cancellare i dati di Safari.</p><button onclick=exportData()>Esporta backup</button><label>Importa backup JSON</label><input id=imp type=file accept=.json,application/json><button class=alt onclick=importData()>Importa backup</button></div>`}
function setDayType(v){if(v)S.days[day()]=v;else delete S.days[day()];save();renderToday()}function addEntry(){let f=S.foods.find(x=>x.id===af.value),g=num(ag.value);if(!f||g<=0||g>3000)return alert('Quantità non valida');let r=g/100;S.entries.push({id:crypto.randomUUID(),d:day(),m:am.value,n:f.n,g,k:f.k*r,c:f.c*r,p:f.p*r,f:f.f*r});save();renderAll();show('today')}function delEntry(id){S.entries=S.entries.filter(x=>x.id!==id);save();renderAll()}function addFood(){let n=fn.value.trim();if(!n)return alert('Inserisci il nome');S.foods.push({id:crypto.randomUUID(),n,k:num(fk.value),c:num(fc.value),p:num(fp.value),f:num(ff.value),custom:true});save();renderAll()}function delFood(id){if(confirm('Eliminare questo alimento?')){S.foods=S.foods.filter(x=>x.id!==id);save();renderAll()}}function addType(){let n=tn.value.trim();if(!n)return alert('Inserisci il nome');S.types.push({id:crypto.randomUUID(),n,k:num(tk.value),c:num(tc.value),p:num(tp.value)});save();renderAll()}function delType(id){if(confirm('Eliminare questo tipo?')){S.types=S.types.filter(x=>x.id!==id);Object.keys(S.days).forEach(d=>{if(S.days[d]===id)delete S.days[d]});save();renderAll()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='diario-macro-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(){let f=imp.files[0];if(!f)return alert('Seleziona il backup');let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.foods||!x.entries||!x.types)throw 0;S=x;save();renderAll();alert('Backup importato')}catch{alert('Backup non valido')}};r.readAsText(f)}function show(id){document.querySelectorAll('.page,.tabs button').forEach(x=>x.classList.remove('on'));document.querySelector('#'+id).classList.add('on');document.querySelector(`[data-p=${id}]`).classList.add('on')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.p));function renderAll(){renderToday();renderAdd();renderFoods();renderTypes();renderBackup()}renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
